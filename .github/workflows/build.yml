name: Build bridge

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

on:
  push:
    branches: [main]
    paths-ignore:
      - '**.md'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Setup Gradle cache
        uses: gradle/actions/setup-gradle@v4

      - name: Build installDist
        run: |
          set -o pipefail
          ./gradlew --no-daemon :bridge:installDist 2>&1 | tee build.log

      - name: Zip dist
        run: |
          cd bridge/build/install
          zip -qr "$GITHUB_WORKSPACE/cs3-bridge-dist-r${{ github.run_number }}.zip" bridge

      - name: Publish to build release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build
          name: bridge build
          files: cs3-bridge-dist-r${{ github.run_number }}.zip
          fail_on_unmatched_files: true

      - name: Publish debug logs
        if: failure()
        uses: softprops/action-gh-release@v2
        with:
          tag_name: debug-logs
          name: debug logs
          files: build.log
          fail_on_unmatched_files: true
