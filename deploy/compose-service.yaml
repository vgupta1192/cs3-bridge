  csbridge:
    build: ./cs3-bridge
    image: stremio-stack/csbridge:local
    container_name: csbridge
    restart: unless-stopped
    mem_limit: 2500m
    memswap_limit: 5g   # = 2x mem_limit: swap-first (2026-09-22)
    environment:
      - CSBRIDGE_PORT=7095
      - CSBRIDGE_DATA_DIR=/app/data
      - CSBRIDGE_VERSION=1.0.0
      # admin token for repo add/remove, resync, health checks; empty = generated into data/admin-token
      - CSBRIDGE_ADMIN_TOKEN=${CSBRIDGE_ADMIN_TOKEN:-}
      - TMDB_API_KEY=${WATCHLY_TMDB_API_KEY:-}
    volumes:
      - ./cs3-bridge/data:/app/data   # owned by 10001:10001 (the image's non-root user)
    # plugins are third-party code running in this process: keep the container
    # itself minimal. Only /app/data and /tmp (sqlite-jdbc unpacks its native
    # library there) are writable
    read_only: true
    tmpfs:
      - /tmp:size=256m
    cap_drop: [ALL]
    security_opt:
      - no-new-privileges:true
    ports:
      - "127.0.0.1:7095:7095"
    labels:
      - "autoheal=true"
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:7095/ping"]
      interval: 60s
      timeout: 10s
      retries: 3
